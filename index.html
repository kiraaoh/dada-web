<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DADA web</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #musicButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 15px;
        }
    </style>
</head>

<body>

    <iframe id="pageFrame" src="home.html"></iframe>

    <audio id="bgMusic" loop>
        <source src="images/bgmusic.mp3" type="audio/mpeg">
    </audio>

    <button id="musicButton">🎵 Play Music</button>

    <script>
        const music = document.getElementById("bgMusic");
        const button = document.getElementById("musicButton");

        button.addEventListener("click", function () {

            if (music.paused) {
                music.play();
                button.textContent = "🔊 Music On";
            } else {
                music.pause();
                button.textContent = "🔇 Music Off";
            }

        });
    </script>

</body>
</html>
